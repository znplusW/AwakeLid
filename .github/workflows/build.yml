name: Windows build and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build and run CI-safe tests
        run: ./build.ps1 -Ci
      - name: Package portable application
        run: ./pack.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: AwakeLid-windows-x64
          path: dist/*
          if-no-files-found: error
